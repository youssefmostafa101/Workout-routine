<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camp Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15141a;
  --bg-elev:#1e1c25;
  --bg-elev-2:#27242f;
  --line:#332f3c;
  --text:#f3efe6;
  --text-dim:#9c98a6;
  --text-faint:#6b6874;
  --accent:#c9a24b;
  --accent-ink:#1a1710;
  --explosive:#c67059;
  --explosive-bg:rgba(198,112,89,.16);
  --strength:#bfa876;
  --strength-bg:rgba(191,168,118,.16);
  --hyp:#79a093;
  --hyp-bg:rgba(121,160,147,.16);
  --radius:10px;
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'IBM Plex Sans',-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{font-family:var(--font-body);padding:32px 18px 72px;-webkit-font-smoothing:antialiased;}
.wrap{max-width:560px;margin:0 auto;}

.hdr{text-align:center;margin-bottom:18px;}
.hdr-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;color:var(--accent);margin:0 0 6px;text-transform:uppercase;}
.hdr-title{font-family:var(--font-display);font-size:54px;letter-spacing:.02em;margin:0;line-height:1;}
.hdr-range{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin:10px 0 0;}

.sync-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0;flex-wrap:wrap;}
.sync-btn{background:var(--bg-elev);border:1px solid var(--line);color:var(--text-dim);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;padding:6px 10px;border-radius:6px;cursor:pointer;}
.sync-btn:hover{border-color:var(--accent);color:var(--text);}
.sync-status{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);}
.sync-status.ok{color:var(--hyp);}
.sync-status.err{color:var(--explosive);}
.sync-status.busy{color:var(--strength);}

.sync-panel{max-width:440px;margin:0 auto 18px;background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.sync-panel[hidden]{display:none;}
.sync-help{font-size:12px;color:var(--text-dim);margin:0 0 10px;line-height:1.5;}
.sync-help a{color:var(--accent);}
.sync-field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;}
.sync-field label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);}
.sync-field input{background:var(--bg-elev-2);border:1px solid var(--line);border-radius:6px;color:var(--text);font-family:var(--font-body);font-size:13.5px;padding:8px 10px;}
.sync-actions{display:flex;gap:8px;margin-top:10px;}
.sync-save{background:var(--accent);color:var(--accent-ink);border:none;border-radius:6px;padding:8px 14px;font-family:var(--font-mono);font-size:11.5px;font-weight:600;cursor:pointer;}
.sync-clear{background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:6px;padding:8px 14px;font-family:var(--font-mono);font-size:11.5px;cursor:pointer;}

.legend{display:flex;justify-content:center;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);}
.legend-dot{width:8px;height:8px;border-radius:50%;}
.legend-dot.explosive{background:var(--explosive);}
.legend-dot.strength{background:var(--strength);}
.legend-dot.hypertrophy{background:var(--hyp);}

.tally{display:flex;justify-content:center;gap:8px;margin-bottom:26px;}
.tally-mark{width:34px;height:34px;border-radius:7px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-faint);transition:background .15s ease,border-color .15s ease,transform .15s ease;}
.tally-mark.is-today{border-color:var(--accent);color:var(--text);}
.tally-mark.is-done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.tally-mark.is-done:nth-child(odd){transform:rotate(-3deg);}
.tally-mark.is-done:nth-child(even){transform:rotate(2deg);}

#days{display:flex;flex-direction:column;gap:10px;}

.day{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.day.is-today{border-color:var(--accent);}
.day>summary{list-style:none;cursor:pointer;}
.day>summary::-webkit-details-marker{display:none;}
.day>summary::marker{content:"";}

.day-hdr{display:flex;align-items:center;gap:14px;padding:14px 16px;}
.day-hdr-date{font-family:var(--font-mono);text-align:center;min-width:42px;line-height:1.25;}
.day-date{display:block;font-size:11px;color:var(--text-faint);}
.day-name{display:block;font-size:10.5px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}
.day-hdr-mid{flex:1;min-width:0;}
.day-title{font-family:var(--font-display);font-size:22px;letter-spacing:.01em;margin:0 0 3px;line-height:1.05;}
.day-meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);}
.day-hdr-right{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);flex-shrink:0;}
.day-progress{font-size:13px;color:var(--text-dim);}
.day.is-complete .day-progress{color:var(--accent);}
.chevron{color:var(--text-faint);transition:transform .15s ease;flex-shrink:0;}
.day[open] .chevron{transform:rotate(180deg);}

.day-body{padding:0 16px 18px;}
.day-note{font-size:13.5px;color:var(--text-dim);margin:0 0 10px;padding-top:12px;border-top:1px solid var(--line);}

.group-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);padding:10px 6px 4px;}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;}

.item-row{display:grid;grid-template-columns:22px 1fr;column-gap:12px;align-items:center;padding:9px 6px;border-radius:8px;cursor:pointer;}
.item-row:hover{background:var(--bg-elev-2);}
.item-cb{grid-column:1;grid-row:1;width:22px;height:22px;margin:0;opacity:0;cursor:pointer;}
.item-check{grid-column:1;grid-row:1;position:relative;width:22px;height:22px;border-radius:5px;border:1.5px solid var(--line);pointer-events:none;transition:background .12s ease,border-color .12s ease;}
.item-cb:checked+.item-check{background:var(--accent);border-color:var(--accent);}
.item-cb:checked+.item-check::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg);}
.item-cb:focus-visible+.item-check{outline:2px solid var(--accent);outline-offset:2px;}

.item-body{grid-column:2;grid-row:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
.item-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.item-name{font-size:14.5px;}
.item-cb:checked~.item-body .item-name{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--text-faint);}
.item-detail{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);white-space:nowrap;flex-shrink:0;}
.item-bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.item-sub{font-size:11px;color:var(--text-faint);}
.item-cat{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;white-space:nowrap;}
.cat-explosive{background:var(--explosive-bg);color:var(--explosive);}
.cat-strength{background:var(--strength-bg);color:var(--strength);}
.cat-hypertrophy{background:var(--hyp-bg);color:var(--hyp);}

.lift-row{padding:0 6px 8px 40px;}
.lift-display{background:none;border:none;padding:0;margin:0;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);cursor:pointer;text-align:left;}
.lift-display:hover{color:var(--accent);}
.lift-display b{color:var(--text-dim);font-weight:600;}
.lift-edit{display:flex;align-items:center;gap:6px;margin-top:5px;}
.lift-edit[hidden]{display:none;}
.lift-w,.lift-r{width:58px;background:var(--bg-elev-2);border:1px solid var(--line);border-radius:5px;color:var(--text);font-family:var(--font-mono);font-size:12px;padding:5px 6px;}
.lift-x{color:var(--text-faint);font-size:11px;}
.lift-unit{color:var(--text-faint);font-size:10.5px;}
.lift-save{background:var(--accent);color:var(--accent-ink);border:none;border-radius:5px;padding:5px 10px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;cursor:pointer;}

@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
@media (max-width:380px){.hdr-title{font-size:44px;}.day-title{font-size:19px;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <p class="hdr-eyebrow">7-Day Camp</p>
    <h1 class="hdr-title">CAMP LOG</h1>
    <p class="hdr-range" id="weekRange"></p>
  </header>

  <div class="sync-bar">
    <button class="sync-btn" id="syncToggle" type="button">Sync setup</button>
    <span class="sync-status" id="syncStatusText"></span>
  </div>
  <div class="sync-panel" id="syncPanel" hidden>
    <p class="sync-help">One-time per device, so your weights follow you everywhere. Create a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained token</a> scoped to this repo only, with <b>Contents: Read and write</b>, then fill this in.</p>
    <div class="sync-field"><label>GitHub username</label><input id="cfgOwner" autocomplete="off"></div>
    <div class="sync-field"><label>Repository name</label><input id="cfgRepo" autocomplete="off"></div>
    <div class="sync-field"><label>Personal access token</label><input id="cfgToken" type="password" autocomplete="off"></div>
    <div class="sync-actions">
      <button class="sync-save" id="cfgSave" type="button">Connect</button>
      <button class="sync-clear" id="cfgClear" type="button">Remove</button>
    </div>
  </div>

  <div class="legend">
    <span class="legend-item"><span class="legend-dot explosive"></span>Explosive tempo · 5 max</span>
    <span class="legend-item"><span class="legend-dot strength"></span>Strength · 8-10</span>
    <span class="legend-item"><span class="legend-dot hypertrophy"></span>Hypertrophy · 12-20</span>
  </div>
  <div class="tally" id="tally"></div>
  <main id="days"></main>
</div>

<script>

const SYNC_KEY = 'campLogSync';
const LIFTS_LOCAL_KEY = 'campLogLifts';
const LIFTS_PATH = 'lifts.json';

      {name:"DB Pullover", sub:"Teres major", cat:"hypertrophy", detail:"2 x 12-20", group:"Back"},

      {name:"Hammer Curl", sub:"Brachialis", cat:"hypertrophy", detail:"2 x 12-20", group:"Biceps"},
      {name:"EZ-Bar Reverse Curl", sub:"Brachioradialis", cat:"hypertrophy", detail:"2 x 12-20", group:"Biceps"},
    ]
  },
  { name:"Wednesday", title:"Leg", meta:"7 exercises", time:"~45 min",
    note:"Quads, hamstrings, glutes — one move per head. Hip thrust goes explosive; RDL stays a rep short of failure.",
    items:[
      {name:"Leg Extension", sub:"Rectus femoris", cat:"hypertrophy", detail:"2 x 12-20", group:"Quads"},
      {name:"Narrow-Stance Squats", sub:"Vastus lateralis", cat:"strength", detail:"2 x 8-10", group:"Quads"},
      {name:"DB Step-Ups", sub:"Vastus medialis", cat:"strength", detail:"2 x 8-10", group:"Quads"},
      {name:"Romanian Deadlift", sub:"Biceps femoris", cat:"strength", detail:"2 x 8-10, stop short of failure", group:"Hamstrings"},
      {name:"Leg Curl", sub:"Semitendinosus / semimembranosus", cat:"hypertrophy", detail:"2 x 12-20", group:"Hamstrings"},
      {name:"Barbell Hip Thrust", sub:"Glute max", cat:"explosive", detail:"2 x 5 max", group:"Glutes"},
      {name:"Cable Hip Abduction", sub:"Glute medius", cat:"hypertrophy", detail:"2 x 12-20", group:"Glutes"},
    ]
  },
  { name:"Thursday", title:"Short-Term Cardio", meta:"Fasted", time:"~30-35 min",
    note:"5 rounds, 1 min rest between rounds. Move as fast as you can.",
    items:[
      {name:"Kettlebell Swings", detail:"x 20"},
      {name:"Burpees", detail:"x 15"},

      {name:"Heavy Bag, all-out", detail:"30 sec"},
    ]
  },
  { name:"Friday", title:"Rest", meta:"", time:"\u2014",
    note:"Full rest. No lifting, no explosive work.",
    items:[]
  },
  { name:"Saturday", title:"Supplementary", meta:"17 exercises", time:"~55 min",
    note:"Traps, neck, abs, forearms, calves — everything the other days skip. Superset flexor+extensor, neck front+back, and calf in+out to stay under an hour.",
    items:[
      {name:"Cable Crunch", sub:"Upper abs", cat:"hypertrophy", detail:"2 x 12-20", group:"Abs"},
      {name:"Hanging Leg Raise", sub:"Lower abs", cat:"hypertrophy", detail:"2 x 12-20", group:"Abs"},

      {name:"Push-Up Plus", sub:"Serratus anterior", cat:"hypertrophy", detail:"2 x 12-20", group:"Abs"},
      {name:"Wrist Curls", sub:"Flexors", cat:"hypertrophy", detail:"2 x 12-20", group:"Forearms"},
      {name:"Reverse Wrist Curls", sub:"Extensors", cat:"hypertrophy", detail:"2 x 12-20", group:"Forearms"},
      {name:"DB Pronation / Supination", sub:"Pronators / supinators", cat:"hypertrophy", detail:"2 x 12-20", group:"Forearms"},
      {name:"Farmer Carry", sub:"Grip", cat:"hypertrophy", detail:"2 x 30-40m", group:"Forearms"},
      {name:"Neck Curl", sub:"Flexion, front", cat:"hypertrophy", detail:"2 x 12-20", group:"Neck"},
      {name:"Neck Harness Extension", sub:"Extension, back", cat:"hypertrophy", detail:"2 x 12-20", group:"Neck"},
      {name:'"Mike Tyson"', sub:"Front & back", cat:"hypertrophy", detail:"2 x 12-20", group:"Neck"},
      {name:"Barbell / DB Shrugs", sub:"Upper traps", cat:"hypertrophy", detail:"2 x 12-20", group:"Traps"},
      {name:"Face Pulls", sub:"Middle traps", cat:"hypertrophy", detail:"2 x 12-20", group:"Traps"},
      {name:"Y-Raises", sub:"Lower traps", cat:"hypertrophy", detail:"2 x 12-20", group:"Traps"},
      {name:"Standing Calf Raise", sub:"Inner, medial gastroc", cat:"hypertrophy", detail:"2 x 12-20", group:"Calves"},
      {name:"Seated Calf Raise", sub:"Outer, lateral gastroc", cat:"hypertrophy", detail:"2 x 12-20", group:"Calves"},
      {name:"Tib Raises", sub:"Tibialis anterior / shin", cat:"hypertrophy", detail:"2 x 12-20", group:"Calves"},
    ]
  },
];

/* ---------- checkbox / completion state (local per device) ---------- */
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

/* ---------- lift data (weight / reps, last + best) ---------- */
function loadLocalLifts(){
  try{
    const raw = localStorage.getItem(LIFTS_LOCAL_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveLocalLifts(){
  try{ localStorage.setItem(LIFTS_LOCAL_KEY, JSON.stringify(liftData)); }catch(e){}
}

function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,(m,p)=>String.fromCharCode(parseInt(p,16))));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(atob(str).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}

function getSyncConfig(){
  try{ return JSON.parse(localStorage.getItem(SYNC_KEY)||'null'); }catch(e){ return null; }
}
function saveSyncConfig(cfg){
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify(cfg)); }catch(e){}
}
function clearSyncConfig(){
  try{ localStorage.removeItem(SYNC_KEY); }catch(e){}
}

let liftsSha = null;
let syncStatus = 'unconfigured';

function ghHeaders(cfg){
  return { 'Authorization': `token ${cfg.token}`, 'Accept': 'application/vnd.github+json' };
}

async function refreshSha(cfg){
  try{
    const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${LIFTS_PATH}`, { headers: ghHeaders(cfg) });
    if(res.ok){ const json = await res.json(); liftsSha = json.sha; }
    else if(res.status===404){ liftsSha = null; }
  }catch(e){}
}

async function fetchLiftsFromGitHub(){
  const cfg = getSyncConfig();
  if(!cfg || !cfg.owner || !cfg.repo || !cfg.token){ syncStatus='unconfigured'; renderSyncStatus(); return null; }
  syncStatus = 'busy'; renderSyncStatus();
  try{
    const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${LIFTS_PATH}`, { headers: ghHeaders(cfg) });
    if(res.status===404){ liftsSha = null; syncStatus='ok'; renderSyncStatus(); return {}; }
    if(!res.ok){ throw new Error(String(res.status)); }
    const json = await res.json();
    liftsSha = json.sha;
    const content = b64DecodeUnicode(json.content.replace(/\n/g,''));
    syncStatus = 'ok'; renderSyncStatus();
    return JSON.parse(content);
  }catch(e){
    syncStatus = 'err'; renderSyncStatus();
    return null;
  }
}

async function pushLiftsToGitHub(retry){
  const cfg = getSyncConfig();
  if(!cfg || !cfg.owner || !cfg.repo || !cfg.token) return;
  syncStatus = 'busy'; renderSyncStatus();
  try{
    const body = { message:'Update lift data', content: b64EncodeUnicode(JSON.stringify(liftData,null,2)) };
    if(liftsSha) body.sha = liftsSha;
    const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${LIFTS_PATH}`, {
      method:'PUT', headers:{...ghHeaders(cfg),'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    if(res.status===409 && retry!==false){
      await refreshSha(cfg);
      return pushLiftsToGitHub(false);
    }
    if(!res.ok){ throw new Error(String(res.status)); }
    const json = await res.json();
    liftsSha = json.content.sha;
    syncStatus = 'ok';
  }catch(e){
    syncStatus = 'err';
  }
  renderSyncStatus();
}

function renderSyncStatus(){
  const el = document.getElementById('syncStatusText');
  if(!el) return;
  el.className = 'sync-status';
  if(syncStatus==='unconfigured'){ el.textContent = 'Not connected — set up once per device'; }
  else if(syncStatus==='busy'){ el.textContent = 'Syncing...'; el.classList.add('busy'); }
  else if(syncStatus==='ok'){ el.textContent = 'Synced'; el.classList.add('ok'); }
  else if(syncStatus==='err'){ el.textContent = 'Sync error — check token / repo'; el.classList.add('err'); }
}

function liftDisplayText(rec){
  if(!rec || rec.lastWeight==null){ return 'Tap to log weight & reps'; }
  const last = `${rec.lastWeight}kg\u00d7${rec.lastReps}`;
  const best = rec.bestWeight!=null ? `${rec.bestWeight}kg\u00d7${rec.bestReps}` : last;
  return `Last <b>${last}</b>  \u00b7  Best <b>${best}</b>`;
}

function saveLift(exName, weight, reps){
  if(weight==null || isNaN(weight)) return;
  if(!liftData[exName]) liftData[exName] = {};
  const rec = liftData[exName];
  rec.lastWeight = weight;
  rec.lastReps = reps;
  if(rec.bestWeight == null || weight > rec.bestWeight){
    rec.bestWeight = weight;
    rec.bestReps = reps;
  }
  saveLocalLifts();
  pushLiftsToGitHub(true);
}

/* ---------- date helpers ---------- */
function startOfWeek(d){
  const date = new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() - date.getDay());
  return date;
}
function dateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtCardDate(d){
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase();
}
function fmtWeekRange(start){
  const end = new Date(start);
  end.setDate(start.getDate()+6);
  const sameMonth = start.getMonth()===end.getMonth();
  const startStr = start.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const endStr = sameMonth ? end.getDate() : end.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return `Week of ${startStr}\u2013${endStr}`;
}

function dayCompletion(day, dayState){
  if(day.items.length===0){
    const done = !!(dayState && dayState.rested);
    return {done: done?1:0, total:1, complete:done};
  }
  const total = day.items.length;
  const done = day.items.filter((_,idx)=> dayState && dayState[idx]).length;
  return {done, total, complete: done===total};
}

function catLabel(cat){
  if(cat==='explosive') return 'Explosive Tempo';
  if(cat==='strength') return 'Strength';
  if(cat==='hypertrophy') return 'Hypertrophy';
  return '';
}

function itemRowHTML(it, idx, dayState, key){
  const checked = dayState[idx] ? 'checked' : '';
  const hasMeta = it.sub || it.cat;
  const bottom = hasMeta ? `
        <span class="item-bottom">
          ${it.sub ? `<span class="item-sub">${it.sub}</span>` : ''}
          ${it.cat ? `<span class="item-cat cat-${it.cat}">${catLabel(it.cat)}</span>` : ''}
        </span>` : '';
  let liftHTML = '';
  if(it.cat){
    const rec = liftData[it.name];
    liftHTML = `
    <div class="lift-row" data-ex="${it.name}">
      <button class="lift-display" type="button">${liftDisplayText(rec)}</button>
      <div class="lift-edit" hidden>
        <input class="lift-w" type="number" step="any" inputmode="decimal" placeholder="${rec&&rec.lastWeight!=null?rec.lastWeight:'kg'}">
        <span class="lift-unit">kg</span>
        <span class="lift-x">\u00d7</span>
        <input class="lift-r" type="number" step="1" inputmode="numeric" placeholder="${rec&&rec.lastReps!=null?rec.lastReps:'reps'}">
        <button class="lift-save" type="button">Save</button>
      </div>
    </div>`;
  }
  return `
    <li class="item">
      <label class="item-row">
        <input type="checkbox" class="item-cb" ${checked} data-key="${key}" data-idx="${idx}">
        <span class="item-check"></span>
        <span class="item-body">
          <span class="item-top">
            <span class="item-name">${it.name}</span>
            <span class="item-detail">${it.detail}</span>
          </span>${bottom}
        </span>
      </label>${liftHTML}
    </li>`;
}

function render(){
  const today = new Date();
  const weekStart = startOfWeek(today);
  const todayKey = dateKey(today);

  document.getElementById('weekRange').textContent = fmtWeekRange(weekStart);
  renderSyncStatus();

  const tallyEl = document.getElementById('tally');
  const daysEl = document.getElementById('days');
  tallyEl.innerHTML = '';
  daysEl.innerHTML = '';

  DAYS.forEach((day, i)=>{
    const cardDate = new Date(weekStart);
    cardDate.setDate(weekStart.getDate()+i);
    const key = dateKey(cardDate);
    const isToday = key===todayKey;
    const dayState = state[key] || {};
    const comp = dayCompletion(day, dayState);

    const mark = document.createElement('div');
    mark.className = 'tally-mark' + (comp.complete?' is-done':'') + (isToday?' is-today':'');
    mark.textContent = day.name[0];
    tallyEl.appendChild(mark);

    const details = document.createElement('details');
    details.className = 'day' + (comp.complete?' is-complete':'') + (isToday?' is-today':'');
    if(openKeys.has(key)) details.open = true;

    const summary = document.createElement('summary');
    summary.className = 'day-hdr';
    summary.innerHTML = `
      <div class="day-hdr-date">
        <span class="day-date">${fmtCardDate(cardDate)}</span>
        <span class="day-name">${day.name}</span>
      </div>
      <div class="day-hdr-mid">
        <h2 class="day-title">${day.title}</h2>
        ${day.meta ? `<span class="day-meta">${day.meta}</span>` : ''}
      </div>
      <div class="day-hdr-right">
        <span class="day-progress">${comp.done}/${comp.total}</span>
        <svg class="chevron" viewBox="0 0 24 24" width="18" height="18"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>`;
    details.appendChild(summary);

    details.addEventListener('toggle', ()=>{
      if(details.open) openKeys.add(key); else openKeys.delete(key);
    });

    const body = document.createElement('div');
    body.className = 'day-body';

    const note = document.createElement('p');
    note.className = 'day-note';
    note.textContent = day.time !== '\u2014' ? `${day.note}  \u00b7  ${day.time}` : day.note;
    body.appendChild(note);

    if(day.items.length===0){
      const row = document.createElement('label');
      row.className = 'item-row';
      row.innerHTML = `
        <input type="checkbox" class="item-cb" ${dayState.rested?'checked':''} data-key="${key}" data-rest="1">
        <span class="item-check"></span>
        <span class="item-body"><span class="item-top"><span class="item-name">Rested today</span></span></span>`;
      body.appendChild(row);
    } else {
      const ul = document.createElement('ul');
      ul.className = 'items';
      let lastGroup = null;
      let html = '';
      day.items.forEach((it, idx)=>{
        if(it.group && it.group!==lastGroup){
          html += `<li class="group-label">${it.group}</li>`;
          lastGroup = it.group;
        }
        html += itemRowHTML(it, idx, dayState, key);
      });
      ul.innerHTML = html;
      body.appendChild(ul);
    }

    details.appendChild(body);
    daysEl.appendChild(details);
  });

  daysEl.querySelectorAll('input.item-cb').forEach(cb=>{
    cb.addEventListener('change', onToggle);
  });

  daysEl.querySelectorAll('.lift-display').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const editEl = btn.nextElementSibling;
      editEl.hidden = !editEl.hidden;
      if(!editEl.hidden){ editEl.querySelector('.lift-w').focus(); }
    });
  });

  daysEl.querySelectorAll('.lift-save').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = btn.closest('.lift-row');
      const exName = row.dataset.ex;
      const w = parseFloat(row.querySelector('.lift-w').value);
      const rRaw = row.querySelector('.lift-r').value;
      const r = rRaw==='' ? (liftData[exName]&&liftData[exName].lastReps!=null?liftData[exName].lastReps:null) : parseInt(rRaw,10);
      if(isNaN(w)) return;
      saveLift(exName, w, r);
      render();
    });
  });
}

function onToggle(e){
  const cb = e.target;
  const key = cb.dataset.key;
  if(!state[key]) state[key] = {};
  if(cb.dataset.rest){
    state[key].rested = cb.checked;
  } else {
    state[key][cb.dataset.idx] = cb.checked;
  }
  persist();
  render();
}

/* ---------- sync panel wiring ---------- */
function initSyncUI(){
  const toggle = document.getElementById('syncToggle');
  const panel = document.getElementById('syncPanel');
  const cfg = getSyncConfig() || {};
  document.getElementById('cfgOwner').value = cfg.owner || '';
  document.getElementById('cfgRepo').value = cfg.repo || '';
  document.getElementById('cfgToken').value = cfg.token || '';

  toggle.addEventListener('click', ()=>{ panel.hidden = !panel.hidden; });

  document.getElementById('cfgSave').addEventListener('click', async ()=>{
    const owner = document.getElementById('cfgOwner').value.trim();
    const repo = document.getElementById('cfgRepo').value.trim();
    const token = document.getElementById('cfgToken').value.trim();
    if(!owner || !repo || !token) return;
    saveSyncConfig({owner, repo, token});
    panel.hidden = true;
    const remote = await fetchLiftsFromGitHub();
    if(remote){
      liftData = remote;
      saveLocalLifts();
      render();
    }
  });

  document.getElementById('cfgClear').addEventListener('click', ()=>{
    clearSyncConfig();
    liftsSha = null;
    syncStatus = 'unconfigured';
    document.getElementById('cfgOwner').value = '';
    document.getElementById('cfgRepo').value = '';
    document.getElementById('cfgToken').value = '';
    renderSyncStatus();
  });
}

let state = loadState();
let liftData = loadLocalLifts();
let openKeys = new Set([dateKey(new Date())]);
initSyncUI();
render();
fetchLiftsFromGitHub().then(remote=>{
  if(remote){
    liftData = remote;
    saveLocalLifts();
    render();
  }
});
</script>
